name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest ruff
      - name: Lint
        run: ruff check package-project/src/boopackage package-project/tests package-consumer-project
      - name: Build wheel and source distribution
        run: ./build-package.sh
      - name: Install built wheel
        run: ./install-built-package.sh
      - name: Test package behavior
        run: pytest -q package-project/tests
      - name: Run downstream consumer
        run: ./test-consume-package.sh
